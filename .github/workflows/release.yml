name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = dotnet nbgv get-version -v NuGetPackageVersion
          echo "version=$version" >> $env:GITHUB_OUTPUT
          if ($version -match '-') {
            echo "prerelease_flag=--pre" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease_flag=" >> $env:GITHUB_OUTPUT
          }

      - name: Restore & publish
        run: dotnet publish LyricEditor/LyricEditor.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Pack with vpk
        run: >
          dotnet vpk pack
          --packId BYJRK.LyricEditor
          --packTitle "LyricEditor"
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe LyricEditor.exe
          -o releases

      - name: Upload to GitHub Releases
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/BYJRK/LyricEditor
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          ${{ steps.version.outputs.prerelease_flag }}
